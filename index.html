<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino de Infectologia – MI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1EE; --card:#FFFFFF; --ink:#172026; --muted:#5A6A70; --line:#D3DCD7;
  --teal:#1F5F5B; --teal-soft:#DCEBE7; --ok:#2F7D4A; --ok-soft:#E1F1E6; --bad:#B3392F; --bad-soft:#F7E2DF; --amber:#9A6514;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#111816; --card:#1A2321; --ink:#E7EEEB; --muted:#9AABA6; --line:#2C3835;
  --teal:#6FB8B0; --teal-soft:#1F3532; --ok:#6CC08A; --ok-soft:#1C3325; --bad:#EE8A80; --bad-soft:#3A2120; --amber:#E0B060; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#111816; --card:#1A2321; --ink:#E7EEEB; --muted:#9AABA6; --line:#2C3835;
  --teal:#6FB8B0; --teal-soft:#1F3532; --ok:#6CC08A; --ok-soft:#1C3325; --bad:#EE8A80; --bad-soft:#3A2120; --amber:#E0B060; color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:Literata,Georgia,serif;font-weight:600;font-size:1.9rem;line-height:1.15;margin:8px 0 6px}
.sub{color:var(--muted);margin:0 0 22px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.lbl{font-weight:600;margin:0 0 10px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 12px;font:inherit;font-size:.88rem;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--teal);border-color:var(--teal);color:var(--card)}
.chip small{opacity:.7;margin-left:4px}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:120px}
.btn{font:inherit;font-weight:600;border-radius:12px;padding:13px 16px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--teal);border-color:var(--teal);color:var(--card)}
.btn[aria-pressed="true"]{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal);background:var(--teal-soft)}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible,.opt:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.row{display:flex;gap:10px;margin-top:6px}
.row .btn{flex:1}
.linky{background:none;border:0;color:var(--teal);font:inherit;font-weight:600;cursor:pointer;padding:4px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:var(--teal);transition:width .25s}
.tema{display:inline-block;font-size:.8rem;color:var(--teal);background:var(--teal-soft);border-radius:6px;padding:3px 8px;margin-bottom:10px}
.qtext{font-family:Literata,Georgia,serif;font-size:1.15rem;line-height:1.5;margin:0 0 16px}
.opt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;cursor:pointer}
.opt b{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.85rem;border:1px solid var(--line)}
.opt.sel{border-color:var(--teal);background:var(--teal-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok b{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad b{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt[disabled]{cursor:default}
.exp{border-left:3px solid var(--teal);padding:10px 12px;background:var(--card);border-radius:0 10px 10px 0;margin:8px 0 14px;font-size:.95rem}
.exp strong{display:block;margin-bottom:3px}
.exp.okc{border-color:var(--ok)} .exp.badc{border-color:var(--bad)}
.score{font-family:Literata,Georgia,serif;font-size:3rem;font-weight:600;line-height:1;margin:4px 0}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td{padding:7px 0;border-bottom:1px solid var(--line)}
td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
.rev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rev p{margin:4px 0}
.rev .q{font-family:Literata,Georgia,serif}
.rev .y{color:var(--bad)} .rev .c{color:var(--ok)}
.flag{color:var(--amber)}
.mb{display:inline-block;width:64px;height:6px;background:var(--line);border-radius:6px;overflow:hidden;vertical-align:middle;margin-right:8px}
.mb i{display:block;height:100%}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--bg);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:1.35rem;font-family:Literata,Georgia,serif;font-weight:600}
.stat span{color:var(--muted);font-size:.85rem}
.chart{display:flex;align-items:flex-end;gap:6px;height:130px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:.72rem;color:var(--muted);gap:3px}
.chart i{display:block;width:100%;border-radius:4px 4px 0 0;min-height:2px}
.tag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:3px 8px;margin:0 6px 6px 0;font-size:.85rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const DATA = [{"t": "Tétano", "q": "Sobre o tétano, assinale a incorreta:", "o": ["O diagnóstico é eminentemente clínico", "Metronidazol é o antimicrobiano de escolha", "A imunoglobulina antitetânica neutraliza a toxina já fixada nas terminações nervosas", "Sulfato de magnésio pode ser usado no controle de espasmos e da disautonomia"], "a": 2, "e": "IGHAT/SAT neutralizam apenas a toxina circulante. A toxina já ligada não é revertida; a recuperação depende do brotamento de novas terminações (semanas)."}, {"t": "Tétano", "q": "Na disautonomia do tétano, qual medicamento NÃO tem papel no controle?", "o": ["Sulfato de magnésio", "Morfina", "Benzodiazepínico"], "a": 2, "e": "Questão recorrente: BZD tratam rigidez e espasmos, mas não controlam a disautonomia. Para a instabilidade autonômica: sulfato de magnésio e opioides."}, {"t": "Tétano", "q": "Na disautonomia tetânica, o uso isolado de qual droga é desaconselhado por associação a hipotensão grave e morte súbita?", "o": ["Propranolol", "Labetalol", "Clonidina", "Sulfato de magnésio"], "a": 0, "e": "Betabloqueador não seletivo isolado (propranolol) associa-se a hipotensão profunda e parada cardíaca. Se necessário, prefere-se labetalol/esmolol."}, {"t": "Tétano", "q": "A tetanospasmina causa a doença por:", "o": ["Bloquear a liberação de acetilcolina na junção neuromuscular", "Bloquear a liberação de GABA e glicina em interneurônios inibitórios", "Ligar-se a receptores nicotínicos pós-sinápticos", "Destruir neurônios do corno anterior da medula"], "a": 1, "e": "Transporte axonal retrógrado até o SNC, clivagem da sinaptobrevina e perda da inibição (GABA/glicina). Bloqueio de ACh na placa é a toxina botulínica."}, {"t": "Tétano", "q": "Paciente com esquema antitetânico completo, último reforço há 7 anos, ferimento profundo contaminado com terra. Conduta (MS):", "o": ["Nenhuma profilaxia", "Apenas limpeza do ferimento", "Uma dose de reforço da vacina", "Vacina + imunoglobulina/soro antitetânico"], "a": 2, "e": "Ferimento de alto risco com última dose há mais de 5 anos: 1 reforço. IGHAT/SAT para esquema incompleto ou desconhecido (e, com >5 anos, em imunodeprimidos, idosos ou desnutridos graves)."}, {"t": "Tétano", "q": "Sobre o tétano, assinale a incorreta:", "o": ["O trismo costuma ser a manifestação inicial", "Período de incubação mais longo associa-se a pior prognóstico", "Febre alta sugere infecção secundária ou disautonomia", "Traqueostomia precoce é recomendada nas formas graves"], "a": 1, "e": "Quanto MENOR o período de incubação (e o período de progressão), pior o prognóstico."}, {"t": "Raiva", "q": "Trabalhador manipulou, com as mãos íntegras, a saliva de uma vaca que morreu com diagnóstico de raiva. Conduta:", "o": ["Vacina, 4 doses", "Soro antirrábico isolado", "Vacina + soro", "Não indicar profilaxia"], "a": 3, "e": "Contato indireto ou de pele íntegra não é exposição. Herbívoro de interesse econômico + pele íntegra = sem profilaxia. Tema que ela adora."}, {"t": "Raiva", "q": "Mordedura superficial na mão causada por morcego. Conduta:", "o": ["Observação, por ser acidente leve", "Vacina, 4 doses, apenas", "Soro + vacina", "Vacina, 2 doses"], "a": 2, "e": "Todo acidente com morcego é classificado como grave, independentemente do tipo de lesão: soro (ou imunoglobulina) + vacina."}, {"t": "Raiva", "q": "Qual animal é considerado de baixo risco, NÃO sendo indicada profilaxia antirrábica após mordedura?", "o": ["Sagui", "Morcego", "Ratazana de esgoto", "Raposa"], "a": 2, "e": "Roedores urbanos (rato, ratazana, camundongo), coelhos, cobaias e hamsters: baixo risco, sem profilaxia. Sagui e raposa são silvestres de alto risco."}, {"t": "Raiva", "q": "Mordedura na mão por cão sadio, passível de observação. Conduta:", "o": ["Vacina 4 doses e observar o animal", "Lavar o ferimento e observar o animal por 10 dias, sem iniciar profilaxia", "Soro + vacina, pois mão é local grave", "Vacina 2 doses e encerrar se o animal seguir sadio"], "a": 1, "e": "Cão/gato passível de observação: observar 10 dias, independentemente da gravidade. Se adoecer, morrer ou desaparecer: soro + vacina."}, {"t": "Raiva", "q": "O soro (ou imunoglobulina) antirrábico pode ser aplicado até:", "o": ["24 h após a 1ª dose de vacina", "72 h após a 1ª dose de vacina", "7 dias após a 1ª dose de vacina", "14 dias após a 1ª dose de vacina"], "a": 2, "e": "Após o 7º dia da 1ª dose a vacina já induz anticorpos e o soro pode interferir. Infiltrar o máximo possível ao redor da lesão."}, {"t": "Raiva", "q": "Padrão-ouro para diagnóstico laboratorial da raiva:", "o": ["Corpúsculo de Negri na histopatologia", "Imunofluorescência direta em tecido nervoso", "Sorologia no LCR", "RT-PCR em saliva"], "a": 1, "e": "IFD em tecido nervoso (com prova biológica/isolamento). Negri é achado clássico histórico, não padrão-ouro."}, {"t": "Raiva", "q": "Sobre a raiva humana no Brasil, assinale a incorreta:", "o": ["Morcegos são hoje a principal fonte de casos humanos", "A transmissão por cães foi drasticamente reduzida", "O vírus é neurotrópico, causando encefalite", "Corpúsculos de Negri são o padrão-ouro diagnóstico", "A letalidade é próxima de 100%"], "a": 3, "e": "Padrão-ouro é a imunofluorescência direta."}, {"t": "IST", "q": "Sobre a donovanose (granuloma inguinal), assinale a incorreta:", "o": ["É causada por Klebsiella granulomatis", "Corpúsculos de Donovan são vistos em macrófagos", "Cursa com bubão doloroso que fistuliza em 'bico de regador'", "Azitromicina é primeira linha"], "a": 2, "e": "Bico de regador é do linfogranuloma venéreo. Donovanose: úlcera indolor, vermelho-vivo, friável, com pseudobubões (granulomas subcutâneos), sem adenopatia verdadeira."}, {"t": "IST", "q": "Tratamento de escolha do linfogranuloma venéreo:", "o": ["Azitromicina 1 g dose única", "Doxiciclina 100 mg 12/12h por 21 dias", "Ceftriaxona 500 mg IM dose única", "Penicilina benzatina 2,4 milhões UI"], "a": 1, "e": "LGV (C. trachomatis L1–L3): doxiciclina 21 dias. Azitromicina 1 g semanal por 3 semanas é alternativa."}, {"t": "IST", "q": "Homem com uretrite de secreção clara e mucoide, raramente purulenta, disúria leve. Agente mais provável:", "o": ["Neisseria gonorrhoeae", "Chlamydia trachomatis", "Haemophilus ducreyi", "Klebsiella granulomatis"], "a": 1, "e": "Uretrite não gonocócica: secreção escassa, clara/mucoide. Gonorreia: purulenta, abundante, início abrupto."}, {"t": "IST", "q": "Tratamento da uretrite (abordagem sindrômica, PCDT-IST/MS):", "o": ["Ceftriaxona 500 mg IM + azitromicina 1 g VO, dose única", "Ciprofloxacino 500 mg dose única", "Ceftriaxona isolada", "Metronidazol 2 g dose única"], "a": 0, "e": "Cobre gonococo e clamídia. Quinolonas não são usadas pela alta resistência gonocócica."}, {"t": "IST", "q": "Sobre sífilis, assinale a incorreta:", "o": ["A neurossífilis ocorre exclusivamente na sífilis tardia", "O efeito prozona pode gerar VDRL falso-negativo", "A reação de Jarisch-Herxheimer não indica suspensão da penicilina", "Condiloma plano é manifestação da sífilis secundária"], "a": 0, "e": "Neurossífilis pode ocorrer em qualquer fase, inclusive precoce (meningite, acometimento ocular/auditivo)."}, {"t": "IST", "q": "Qual achado NÃO se relaciona à sífilis?", "o": ["Pupila de Argyll Robertson", "Lesões em alvo", "Aortite", "Goma", "Alopecia em clareira"], "a": 1, "e": "Lesão em alvo é de eritema multiforme. Ela já cobrou exatamente isso."}, {"t": "IST", "q": "Tratamento da neurossífilis:", "o": ["Penicilina benzatina 7,2 milhões UI em 3 semanas", "Penicilina G cristalina 18–24 milhões UI/dia por 14 dias", "Doxiciclina 100 mg 12/12h por 28 dias", "Ceftriaxona 1 g por 3 dias"], "a": 1, "e": "Benzatina não atinge nível treponemicida no LCR. Ceftriaxona 2 g/dia por 10–14 dias é alternativa."}, {"t": "IST", "q": "Cancro mole – assinale a correta:", "o": ["Lesão única, indolor, de fundo limpo", "Úlceras múltiplas, dolorosas, de fundo sujo, por Haemophilus ducreyi", "Não cursa com adenopatia", "Tratamento com penicilina benzatina"], "a": 1, "e": "Bubão pode fistulizar por orifício único. Tratamento: azitromicina 1 g VO dose única (ou ceftriaxona)."}, {"t": "IST", "q": "No seguimento da sífilis recente tratada, considera-se resposta adequada:", "o": ["Negativação do VDRL em 3 meses", "Queda de 2 diluições do teste não treponêmico em até 6 meses", "Negativação do teste treponêmico", "Queda de 1 diluição em 12 meses"], "a": 1, "e": "Recente: queda de 2 títulos em até 6 meses; tardia: em até 12 meses. Teste treponêmico permanece reagente (cicatriz sorológica)."}, {"t": "Hepatites virais", "q": "Sobre hepatites virais, assinale a incorreta:", "o": ["Adultos com HAV têm maior letalidade que crianças", "A hepatite C cronifica em cerca de 60–85% dos casos", "A cronificação do HBV é maior quando adquirido no período neonatal", "A maioria dos casos agudos de hepatite C é sintomática"], "a": 3, "e": "HCV agudo é assintomático em ~80%. HBV: cronifica ~90% no neonato, <5% no adulto."}, {"t": "Hepatites virais", "q": "Marcador mais precoce de comprometimento da função de síntese na hepatite aguda:", "o": ["Albumina", "Tempo de protrombina (TAP/INR)", "Bilirrubina total", "Fosfatase alcalina"], "a": 1, "e": "Fatores de coagulação têm meia-vida de horas; albumina ~20 dias. Ela cobrou TAP."}, {"t": "Hepatites virais", "q": "Hepatite D – assinale a incorreta:", "o": ["Na coinfecção B+D, a maioria evolui para cura", "Na superinfecção, a cronificação ocorre em mais de 90%", "HBV+HDV progride para cirrose mais rápido que HBV isolado", "Tenofovir instituído precocemente é curativo para o HDV"], "a": 3, "e": "Análogos nucleos(t)ídeos não agem sobre o HDV. Tratamento: interferon peguilado (bulevirtida onde disponível)."}, {"t": "Hepatites virais", "q": "Perfil: HBsAg não reagente, anti-HBc total reagente, anti-HBs não reagente. Qual interpretação NÃO é possível?", "o": ["Janela imunológica da infecção aguda", "Infecção passada com anti-HBs em queda", "Resposta vacinal prévia", "Infecção oculta pelo HBV"], "a": 2, "e": "Vacina induz apenas anti-HBs. Anti-HBc indica contato com o vírus. Na janela, o anti-HBc IgM é reagente."}, {"t": "Hepatites virais", "q": "Hepatite E – assinale a incorreta:", "o": ["É vírus RNA de transmissão fecal-oral", "Tem maior gravidade em gestantes, sobretudo no 3º trimestre", "Pode cronificar em transplantados/imunossuprimidos", "Nunca cronifica, independentemente do estado imune"], "a": 3, "e": "Genótipo 3 cronifica em imunossuprimidos (transplante de órgão sólido). Em prova geral costuma-se dizer que 'não cronifica' — atenção ao enunciado."}, {"t": "Hepatites virais", "q": "Qual NÃO é manifestação extra-hepática classicamente associada ao HCV?", "o": ["Crioglobulinemia mista", "Glomerulonefrite membranoproliferativa", "Porfiria cutânea tarda", "Poliarterite nodosa"], "a": 3, "e": "PAN associa-se ao HBV. HCV também: líquen plano, linfoma não Hodgkin B, resistência insulínica."}, {"t": "Hepatites virais", "q": "Na hepatite viral aguda, assinale a incorreta:", "o": ["Elevação importante de transaminases", "FA eleva-se pouco", "Pode haver aumento transitório de alfafetoproteína", "Queda precoce e importante da albumina"], "a": 3, "e": "Albumina tem meia-vida longa; não cai precocemente. AFP pode subir por regeneração hepatocitária."}, {"t": "Hepatites virais", "q": "Esquema pangenotípico preferencial para hepatite C crônica sem cirrose descompensada:", "o": ["Interferon peguilado + ribavirina", "Sofosbuvir + velpatasvir por 12 semanas", "Tenofovir por 48 semanas", "Entecavir"], "a": 1, "e": "Alternativa: glecaprevir/pibrentasvir 8 semanas. IP de HCV (glecaprevir) é contraindicado em cirrose descompensada."}, {"t": "HIV/Aids", "q": "Paciente em situação de rua, HIV sem tratamento, com tosse e suspeita de pneumocistose. Assinale a correta:", "o": ["pO2 > 70 mmHg exclui PCP", "LDH normal não exclui o diagnóstico", "Vidro fosco na TC é patognomônico", "Leucocitose e PCR elevadas afastam PCP"], "a": 1, "e": "LDH é sensível, mas não específico; normal não exclui. Vidro fosco é sugestivo, não patognomônico."}, {"t": "HIV/Aids", "q": "Corticoide adjuvante na pneumocistose está indicado quando:", "o": ["CD4 < 200 células/mm³", "PaO2 < 70 mmHg em ar ambiente ou gradiente A-a ≥ 35 mmHg", "Sempre que houver vidro fosco", "LDH > 500 U/L"], "a": 1, "e": "Prednisona 40 mg 12/12h (dias 1–5), 40 mg/dia (6–10), 20 mg/dia (11–21), iniciada idealmente em até 72 h do SMX-TMP."}, {"t": "HIV/Aids", "q": "Lesões hipodensas de substância branca, sem efeito de massa e sem realce ao contraste, em PVHIV com CD4 baixo:", "o": ["Neurotoxoplasmose", "Linfoma primário do SNC", "Leucoencefalopatia multifocal progressiva", "Criptococoma"], "a": 2, "e": "LEMP (vírus JC). Toxo: lesões com realce anelar e edema, núcleos da base. Linfoma: lesão periventricular, EBV no LCR."}, {"t": "HIV/Aids", "q": "Qual NÃO é doença definidora de aids (critério CDC adaptado)?", "o": ["Candidíase esofágica", "Câncer de colo uterino invasivo", "Candidíase oral", "Sarcoma de Kaposi"], "a": 2, "e": "Candidíase oral é sinal de imunodeficiência (pontua no critério Rio de Janeiro/Caracas), mas não é doença definidora. Esofágica, traqueal ou brônquica é."}, {"t": "HIV/Aids", "q": "PVHIV com TB em uso de rifampicina iniciando TDF/3TC/DTG. Ajuste necessário:", "o": ["Nenhum", "Dolutegravir 50 mg 12/12h", "Trocar 3TC por AZT", "Reduzir dose de TDF"], "a": 1, "e": "Rifampicina induz UGT1A1/CYP3A4. Dobra-se o DTG durante e por 2 semanas após a rifampicina. Alguns anticonvulsivantes indutores exigem o mesmo."}, {"t": "HIV/Aids", "q": "Elevação discreta da creatinina após início de dolutegravir, sem queda real da filtração glomerular, ocorre por:", "o": ["Nefrite intersticial", "Inibição da secreção tubular de creatinina (OCT2)", "Tubulopatia proximal (Fanconi)", "Rabdomiólise"], "a": 1, "e": "Mesmo mecanismo do trimetoprim e da cobicistate. Fanconi é do tenofovir (TDF)."}, {"t": "HIV/Aids", "q": "Sobre a TARV, assinale a incorreta:", "o": ["Lamivudina exige ajuste à função renal", "TDF pode causar síndrome de Fanconi e perda de massa óssea", "Na meningite criptocócica, a TARV deve ser iniciada na mesma semana do diagnóstico", "Efavirenz pode causar sintomas neuropsiquiátricos"], "a": 2, "e": "Na meningite criptocócica adia-se a TARV por 4–6 semanas (maior mortalidade com início precoce — ensaio COAT)."}, {"t": "HIV/Aids", "q": "Sobre HIV, assinale a incorreta:", "o": ["Herpes zoster ocorre com qualquer nível de CD4", "Pneumonia por atípicos é a etiologia bacteriana mais comum nesse grupo", "LEMP é a doença desmielinizante mais comum na aids", "Coinfecção com HCV acelera a progressão para cirrose"], "a": 1, "e": "Pneumococo é a principal causa de pneumonia bacteriana em PVHIV."}, {"t": "HIV/Aids", "q": "Tratamento da cistoisosporíase em PVHIV:", "o": ["Nitazoxanida", "Sulfametoxazol-trimetoprima", "Albendazol", "Metronidazol"], "a": 1, "e": "Cystoisospora belli: SMX-TMP. Nitazoxanida é opção para criptosporidiose (cuja base é a TARV)."}, {"t": "HIV/Aids", "q": "Neurotoxoplasmose em paciente alérgico a sulfa. Esquema alternativo:", "o": ["Pirimetamina + clindamicina + ácido folínico", "Fluconazol", "Pirimetamina isolada", "Espiramicina"], "a": 0, "e": "Padrão: sulfadiazina + pirimetamina + ácido folínico, 6 semanas. SMX-TMP também é alternativa válida."}, {"t": "HIV-2 (artigo)", "q": "HIV-2 – assinale a incorreta:", "o": ["É endêmico na África Ocidental (ex.: Guiné-Bissau, Cabo Verde)", "Tem menor transmissibilidade sexual e vertical que o HIV-1", "Progride mais lentamente, com cargas virais mais baixas", "É sensível aos ITRNN, como efavirenz e nevirapina"], "a": 3, "e": "HIV-2 é intrinsecamente resistente aos ITRNN e à enfuvirtida."}, {"t": "HIV-2 (artigo)", "q": "Qual droga NÃO deve compor esquema para HIV-2 por resistência intrínseca?", "o": ["Dolutegravir", "Tenofovir", "Efavirenz", "Darunavir/ritonavir"], "a": 2, "e": "ITRNN (efavirenz, nevirapina, rilpivirina, etravirina) e enfuvirtida não têm ação."}, {"t": "HIV-2 (artigo)", "q": "Monitoramento laboratorial do HIV-2 – assinale a correta:", "o": ["A carga viral do HIV-1 quantifica adequadamente o HIV-2", "Os ensaios de carga viral do HIV-1 não detectam o HIV-2, exigindo teste específico", "O HIV-2 não é detectado pelos imunoensaios de 4ª geração", "O CD4 não tem utilidade no HIV-2"], "a": 1, "e": "Imunoensaios detectam HIV-1/2; a diferenciação e a carga viral exigem testes específicos. CD4 segue útil."}, {"t": "HIV-2 (artigo)", "q": "Esquema preferencial no HIV-2 ou coinfecção HIV-1/HIV-2:", "o": ["2 ITRN + inibidor de integrase (ex.: TDF/3TC + DTG)", "2 ITRN + efavirenz", "2 ITRN + nevirapina", "Enfuvirtida + 2 ITRN"], "a": 0, "e": "Inibidores de integrase têm boa atividade. Se usar IP, preferir darunavir/r ou lopinavir/r."}, {"t": "HIV-2 (artigo)", "q": "Entre os inibidores de protease, quais mantêm boa atividade contra o HIV-2?", "o": ["Darunavir/r e lopinavir/r", "Atazanavir isolado", "Fosamprenavir", "Nelfinavir"], "a": 0, "e": "Atazanavir, fosamprenavir, nelfinavir e tipranavir têm atividade reduzida no HIV-2."}, {"t": "Antimicrobianos", "q": "NÃO é efeito adverso das fluoroquinolonas:", "o": ["Hiperglicemia", "Hipoglicemia", "Cristalúria", "Hipercalemia"], "a": 3, "e": "FQ: disglicemia, QT longo, tendinopatia/ruptura, aneurisma de aorta, neuropatia, convulsão, cristalúria (cipro), C. difficile."}, {"t": "Antimicrobianos", "q": "Sobre carbapenêmicos, assinale a correta:", "o": ["Reduzem o limiar convulsivo e diminuem os níveis séricos de ácido valproico", "Meropenem tem maior potencial convulsivante que imipenem", "Ertapenem cobre Pseudomonas aeruginosa", "Cobrem MRSA"], "a": 0, "e": "Ela adora: carbapenêmico diminui limiar convulsivo (imipenem > meropenem). A interação com valproato derruba o nível sérico — evitar associação."}, {"t": "Antimicrobianos", "q": "A hipercalemia por sulfametoxazol-trimetoprima ocorre por:", "o": ["Bloqueio de canais ENaC no túbulo distal, semelhante à amilorida", "Hemólise", "Inibição da ECA", "Rabdomiólise"], "a": 0, "e": "Trimetoprim bloqueia o ENaC no néfron distal. Também eleva creatinina por inibir secreção tubular."}, {"t": "Antimicrobianos", "q": "Sobre os aminoglicosídeos, assinale a incorreta:", "o": ["Têm efeito pós-antibiótico", "Têm ação sinérgica com betalactâmicos contra enterococo e estreptococo", "Raramente favorecem infecção por C. difficile", "A ototoxicidade é geralmente reversível"], "a": 3, "e": "Ototoxicidade (coclear e vestibular) é irreversível; nefrotoxicidade é geralmente reversível. Também causam bloqueio neuromuscular e não agem em anaerobiose/pH ácido (abscessos)."}, {"t": "Antimicrobianos", "q": "Principal mecanismo de resistência aos aminoglicosídeos:", "o": ["Enzimas modificadoras (acetil-, fosfo- e adenil-transferases)", "Aumento da permeabilidade de membrana", "Betalactamases", "Alteração de PBP"], "a": 0, "e": "Outros: metilação do rRNA 16S (alto nível, pan-aminoglicosídeo), efluxo e redução de permeabilidade."}, {"t": "Antimicrobianos", "q": "Paciente em uso de vários antimicrobianos apresenta parestesia perioral, formigamento e turvação visual. O responsável mais provável é:", "o": ["Polimixina B", "Meropenem", "Vancomicina", "Linezolida"], "a": 0, "e": "Neurotoxicidade das polimixinas: parestesias, visão turva, ataxia, bloqueio neuromuscular. Ela já cobrou."}, {"t": "Antimicrobianos", "q": "Por que a polimixina B não é a polimixina preferida para infecção urinária?", "o": ["É excretada na urina na forma inativa", "Tem eliminação predominantemente não renal, com baixa concentração urinária", "Não cobre E. coli", "Causa cistite química"], "a": 1, "e": "Colistina (pró-droga colistimetato) é excretada pelo rim e preferida em ITU; polimixina B não precisa de ajuste renal."}, {"t": "Antimicrobianos", "q": "Linezolida – assinale a incorreta:", "o": ["Pode causar trombocitopenia, sobretudo após 2 semanas", "Pode causar síndrome serotoninérgica com ISRS", "Pode causar neuropatia óptica e acidose lática", "Deve ter a dose ajustada à função renal"], "a": 3, "e": "Linezolida não requer ajuste renal."}, {"t": "Antimicrobianos", "q": "Tigeciclina – assinale a incorreta:", "o": ["Não cobre Pseudomonas aeruginosa", "Tem baixa concentração sérica, ruim para bacteremia", "Associou-se a aumento de mortalidade em metanálises", "É primeira escolha para ITU por enterobactérias resistentes"], "a": 3, "e": "Baixa concentração urinária. Também não cobre Proteus/Providencia. Náuseas são comuns."}, {"t": "Antimicrobianos", "q": "A daptomicina não deve ser usada em pneumonia porque:", "o": ["É inativada pelo surfactante pulmonar", "Não penetra no pulmão", "Causa pneumonite química", "Não cobre pneumococo"], "a": 0, "e": "Efeitos adversos: elevação de CPK/miopatia e pneumonia eosinofílica."}, {"t": "Antimicrobianos", "q": "Qual antimicrobiano NÃO cobre Neisseria meningitidis?", "o": ["Vancomicina", "Ceftriaxona", "Cefepime", "Piperacilina-tazobactam"], "a": 0, "e": "Vancomicina age apenas em gram-positivos."}, {"t": "Antimicrobianos", "q": "Sobre a azitromicina, assinale a incorreta:", "o": ["É primeira linha na coqueluche", "É usada para reduzir exacerbações de DPOC", "É primeira linha na febre maculosa", "Pode prolongar o QT"], "a": 2, "e": "Febre maculosa: doxiciclina (cloranfenicol alternativo)."}, {"t": "Antimicrobianos", "q": "Efeito adverso característico do cefepime em insuficiência renal:", "o": ["Neurotoxicidade (encefalopatia, mioclonias, estado de mal não convulsivo)", "Síndrome do homem vermelho", "Pseudolitíase biliar", "Ototoxicidade"], "a": 0, "e": "Homem vermelho: vancomicina (infusão rápida). Pseudolitíase: ceftriaxona."}, {"t": "Antimicrobianos", "q": "Pneumonia adquirida na comunidade leve a moderada: qual o menos indicado?", "o": ["Amoxicilina", "Doxiciclina", "Azitromicina", "Ciprofloxacino"], "a": 3, "e": "Ciprofloxacino tem atividade ruim contra pneumococo. Se quinolona, usar respiratória (levo/moxi)."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Klebsiella pneumoniae produtora de KPC. Opção de escolha:", "o": ["Meropenem em altas doses", "Ceftazidima-avibactam", "Ceftolozano-tazobactam", "Piperacilina-tazobactam"], "a": 1, "e": "Também meropenem-vaborbactam e imipenem-relebactam. Ceftolozano-tazobactam não tem ação contra carbapenemases."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Enterobactéria produtora de metalobetalactamase (NDM). Opção terapêutica:", "o": ["Ceftazidima-avibactam isolado", "Meropenem-vaborbactam", "Ceftazidima-avibactam + aztreonam", "Ertapenem"], "a": 2, "e": "Aztreonam é estável às MBL; o avibactam protege o aztreonam das ESBL/AmpC co-produzidas. Cefiderocol é alternativa."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Bacteremia por E. coli produtora de ESBL – tratamento definitivo preferido:", "o": ["Piperacilina-tazobactam", "Carbapenêmico", "Ceftriaxona", "Cefepime"], "a": 1, "e": "Ensaio MERINO: pior desfecho com pip-tazo. Em cistite por ESBL: nitrofurantoína, fosfomicina, SMX-TMP se sensível."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Qual agente tem AmpC cromossômica induzível, desaconselhando ceftriaxona mesmo quando sensível in vitro?", "o": ["Escherichia coli", "Klebsiella pneumoniae", "Enterobacter cloacae", "Proteus mirabilis"], "a": 2, "e": "Enterobacter cloacae, Klebsiella aerogenes e Citrobacter freundii: risco moderado a alto de desrepressão. Cefepime é opção."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Pseudomonas aeruginosa com resistência difícil de tratar (DTR), sem carbapenemase. Melhor opção:", "o": ["Ceftolozano-tazobactam", "Tigeciclina", "Ertapenem", "Ceftriaxona"], "a": 0, "e": "Alternativas: ceftazidima-avibactam, imipenem-relebactam, cefiderocol."}, {"t": "Resistência em gram-negativos (artigo)", "q": "O avibactam NÃO inibe qual classe de carbapenemase?", "o": ["Classe A (KPC)", "Classe B (metalobetalactamases: NDM, VIM, IMP)", "Classe D (OXA-48)", "Classe C (AmpC)"], "a": 1, "e": "MBL usam zinco e não são inibidas por avibactam, vaborbactam ou relebactam."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Acinetobacter baumannii resistente a carbapenêmico. Qual componente tem atividade intrínseca contra o agente?", "o": ["Sulbactam (ampicilina-sulbactam em altas doses)", "Ceftriaxona", "Ertapenem", "Aztreonam"], "a": 0, "e": "Sulbactam se liga a PBP do Acinetobacter. Sulbactam-durlobactam e cefiderocol são opções mais novas; polimixinas em combinação."}, {"t": "Resistência em gram-negativos (artigo)", "q": "Mecanismo mais comum de resistência da Pseudomonas aos carbapenêmicos na ausência de carbapenemase:", "o": ["Perda da porina OprD", "Produção de ESBL", "Alteração ribossomal", "Metilação do rRNA 16S"], "a": 0, "e": "OprD afeta sobretudo imipenem; hiperexpressão de efluxo (MexAB-OprM) e AmpC também contribuem."}, {"t": "Paracoccidioidomicose", "q": "Forma aguda/subaguda (juvenil) da PCM – NÃO é característica:", "o": ["Hepatoesplenomegalia", "Linfonodomegalia com fistulização", "Eosinofilia", "Tosse e lesão pulmonar como manifestação predominante"], "a": 3, "e": "Forma juvenil acomete sistema fagocítico-mononuclear; pulmão raramente sintomático. Ela cobrou 'não tem tosse'."}, {"t": "Paracoccidioidomicose", "q": "Sobre a paracoccidioidomicose, assinale a correta:", "o": ["Resposta Th1 predomina nas formas aguda e disseminadas", "O estrogênio inibe a transformação micélio→levedura, explicando a predominância masculina da forma crônica", "Tabagismo não influencia o risco", "A forma crônica predomina em mulheres jovens"], "a": 1, "e": "Th1 = controle/forma localizada; Th2 = formas graves/juvenis. Tabagismo é fator de risco importante para a forma crônica."}, {"t": "Paracoccidioidomicose", "q": "Achado laboratorial típico da forma aguda da PCM:", "o": ["Hipogamaglobulinemia", "Hipergamaglobulinemia e eosinofilia", "Linfocitose atípica", "Plaquetose isolada"], "a": 1, "e": "Reflete resposta Th2 com ativação policlonal de linfócitos B."}, {"t": "Paracoccidioidomicose", "q": "Tratamento de escolha nas formas leves e moderadas de PCM:", "o": ["Fluconazol", "Itraconazol", "Anfotericina B", "Caspofungina"], "a": 1, "e": "Itraconazol 6–18 meses. SMX-TMP é alternativa (inclusive na gestação). Anfotericina B nas formas graves. Equinocandinas não têm ação."}, {"t": "Paracoccidioidomicose", "q": "Ao exame micológico direto, a PCM mostra:", "o": ["Hifas septadas com ramificação em ângulo agudo", "Leveduras com múltiplos brotamentos ('roda de leme')", "Leveduras encapsuladas", "Esférulas com endósporos"], "a": 1, "e": "Roda de leme/Mickey Mouse. Esférulas = coccidioidomicose; cápsula = criptococo."}, {"t": "Paracoccidioidomicose", "q": "Na infecção por Paracoccidioides lutzii, a imunodifusão dupla pode ser:", "o": ["Falso-negativa, por utilizar antígenos de P. brasiliensis", "Sempre positiva", "Útil apenas no LCR", "Falso-positiva por reação cruzada com Candida"], "a": 0, "e": "Predomina no Centro-Oeste/Norte. Diagnóstico depende de micológico/histopatológico."}, {"t": "Cripto, histo e mucormicose", "q": "Meningite criptocócica com pressão de abertura de 35 cmH2O e cefaleia intensa. Conduta para a hipertensão intracraniana:", "o": ["Acetazolamida", "Manitol", "Punções lombares de alívio seriadas", "Dexametasona"], "a": 2, "e": "Objetivo: reduzir 50% ou abaixo de 20 cmH2O. Acetazolamida, manitol e corticoide não são recomendados (corticoide aumentou mortalidade)."}, {"t": "Cripto, histo e mucormicose", "q": "Indução do tratamento da meningite criptocócica (esquema de referência):", "o": ["Fluconazol 400 mg/dia", "Anfotericina B (lipossomal preferível) + flucitosina", "Caspofungina", "Voriconazol"], "a": 1, "e": "Consolidação: fluconazol 400–800 mg por 8 semanas; manutenção 200 mg. Equinocandinas não agem em Cryptococcus."}, {"t": "Cripto, histo e mucormicose", "q": "O beta-D-glucana NÃO detecta:", "o": ["Candida", "Aspergillus", "Pneumocystis", "Cryptococcus e Mucorales"], "a": 3, "e": "Cryptococcus (cápsula) e Mucorales têm pouco/nenhum BDG. Galactomanana também é negativa em mucormicose."}, {"t": "Cripto, histo e mucormicose", "q": "Histoplasmose disseminada em aids – assinale a incorreta:", "o": ["Pode causar síndrome hemofagocítica", "Anfotericina B lipossomal é preferível à desoxicolato", "O antígeno urinário é útil no diagnóstico", "Fluconazol é a droga de escolha para manutenção"], "a": 3, "e": "Manutenção/consolidação com itraconazol. Lipossomal teve menor mortalidade que desoxicolato."}, {"t": "Cripto, histo e mucormicose", "q": "Aspecto morfológico da mucormicose no tecido:", "o": ["Hifas finas, septadas, ramificação a 45°", "Hifas largas, pouco ou não septadas, ramificação em ângulo reto", "Pseudo-hifas", "Leveduras encapsuladas"], "a": 1, "e": "Hifas finas septadas a 45° = Aspergillus."}, {"t": "Cripto, histo e mucormicose", "q": "Na indisponibilidade de anfotericina B para tratar mucormicose, usa-se:", "o": ["Voriconazol", "Isavuconazol", "Fluconazol", "Micafungina"], "a": 1, "e": "Isavuconazol (ou posaconazol). Voriconazol não tem ação — e seu uso profilático é fator de risco para mucormicose de escape."}, {"t": "Cripto, histo e mucormicose", "q": "Mucormicose – assinale a incorreta:", "o": ["Cetoacidose diabética é fator de risco clássico", "Deferoxamina aumenta o risco por atuar como sideróforo para o fungo", "Profilaxia com voriconazol protege contra mucormicose", "O desbridamento cirúrgico é parte essencial do tratamento"], "a": 2, "e": "Pilares: anfotericina B lipossomal + cirurgia + correção do fator predisponente."}, {"t": "Cripto, histo e mucormicose", "q": "Sobre a criptococose, assinale a correta:", "o": ["C. gattii acomete sobretudo imunocompetentes e forma criptococomas", "Corticoide melhora o desfecho na meningite criptocócica em HIV", "O rastreio de antígeno criptocócico sérico não tem papel em PVHIV com CD4 baixo", "A tinta da China tem sensibilidade próxima de 100%"], "a": 0, "e": "CrAg sérico é rastreado em PVHIV com CD4 baixo; positivo assintomático → punção lombar e fluconazol preemptivo. Tinta da China ~70–80%."}, {"t": "Aspergilose (artigo)", "q": "Tratamento de primeira linha da aspergilose invasiva:", "o": ["Anfotericina B desoxicolato", "Voriconazol ou isavuconazol", "Fluconazol", "Caspofungina em monoterapia"], "a": 1, "e": "Anfotericina B lipossomal é alternativa. Fluconazol não tem ação contra Aspergillus."}, {"t": "Aspergilose (artigo)", "q": "Galactomanana sérica – assinale a incorreta:", "o": ["Tem melhor desempenho em neutropênicos", "Uso prévio de antifúngico ativo contra filamentosos reduz a sensibilidade", "Em não neutropênicos, a galactomanana no lavado é mais sensível que a sérica", "Tem sensibilidade maior em não neutropênicos do que em neutropênicos"], "a": 3, "e": "Em não neutropênicos (ex.: UTI, DPOC, corticoide) a angioinvasão é menor e a GM sérica perde sensibilidade."}, {"t": "Aspergilose (artigo)", "q": "Na TC, sinal precoce de aspergilose angioinvasiva no neutropênico:", "o": ["Sinal do crescente aéreo", "Sinal do halo", "Árvore em brotamento", "Cavitação"], "a": 1, "e": "Halo = hemorragia ao redor do nódulo (precoce). Crescente aéreo é tardio, na recuperação dos neutrófilos."}, {"t": "Aspergilose (artigo)", "q": "Efeito adverso característico do voriconazol:", "o": ["Alterações visuais transitórias, fotossensibilidade e periostite por fluoreto", "Hipocalemia grave", "Encurtamento do QT", "Ototoxicidade"], "a": 0, "e": "Também hepatotoxicidade, alucinações e câncer de pele em uso prolongado. Exige dosagem sérica."}, {"t": "Aspergilose (artigo)", "q": "Isavuconazol em comparação ao voriconazol – assinale a correta:", "o": ["Encurta o QT e tem menos hepatotoxicidade e efeitos visuais", "Não cobre Mucorales", "Exige veículo com ciclodextrina IV", "Tem mais interações e efeitos visuais"], "a": 0, "e": "Isavuconazol cobre Mucorales; voriconazol não. A formulação IV do vori usa ciclodextrina (cautela na DRC)."}, {"t": "Aspergilose (artigo)", "q": "Aspergilose broncopulmonar alérgica – assinale a correta:", "o": ["Tratamento com corticoide sistêmico, podendo associar itraconazol", "Galactomanana sérica é o critério principal", "Anfotericina B é a primeira linha", "IgE total costuma ser normal"], "a": 0, "e": "Asma/fibrose cística, IgE total muito elevada, IgE específica para Aspergillus, eosinofilia, bronquiectasias centrais."}, {"t": "Aspergilose (artigo)", "q": "Principal complicação do aspergiloma:", "o": ["Hemoptise", "Disseminação hematogênica", "Pneumotórax", "Derrame pleural"], "a": 0, "e": "Tratamento de hemoptise significativa: embolização de artéria brônquica/ressecção cirúrgica."}, {"t": "Meningites", "q": "Indicação de TC de crânio antes da punção lombar na suspeita de meningite bacteriana, EXCETO:", "o": ["Imunossupressão", "Crise convulsiva nova", "Papiledema", "Rigidez de nuca intensa", "Déficit neurológico focal"], "a": 3, "e": "Rigidez de nuca não indica TC. Ela cobrou: não fazer TC 'só pela idade' nem 'pela rigidez' nem 'pelo diabetes'. Nunca atrasar ATB pela TC."}, {"t": "Meningites", "q": "Idoso diabético com meningite bacteriana. Conduta empírica:", "o": ["Ceftriaxona isolada", "Dexametasona + ampicilina + ceftriaxona", "Penicilina cristalina + gentamicina", "Meropenem isolado"], "a": 1, "e": "Acima de 50 anos ou imunodeprimido: cobrir Listeria (ampicilina). Vancomicina se pneumococo resistente for relevante localmente."}, {"t": "Meningites", "q": "Dexametasona na meningite bacteriana – assinale a correta:", "o": ["Iniciar 10–20 min antes ou junto da 1ª dose do antibiótico", "O maior benefício é na meningite meningocócica", "Pode ser iniciada 48 h após o antibiótico com o mesmo benefício", "Acelera a recuperação na meningite por enterovírus"], "a": 0, "e": "0,15 mg/kg 6/6h por 4 dias. Benefício em mortalidade na pneumocócica; perda auditiva no Haemophilus em crianças."}, {"t": "Meningites", "q": "Em qual etiologia a corticoterapia não é recomendada, com possível pior desfecho?", "o": ["Pneumococo", "Listeria monocytogenes", "Meningite tuberculosa", "Neurocisticercose"], "a": 1, "e": "Ela anotou: corticoide não em Listeria. Meningococo não é contraindicação. TB e neurocisticercose: usa-se corticoide."}, {"t": "Meningites", "q": "Meningite tuberculosa – assinale a incorreta:", "o": ["ADA baixa no LCR não exclui o diagnóstico", "Baciloscopia no LCR tem baixa sensibilidade", "Corticoide é indicado apenas nos casos graves", "Tratamento total de 12 meses (2 RHZE + 10 RH)"], "a": 2, "e": "Corticoide é indicado em todos os casos de meningotuberculose. Anticonvulsivante profilático não é rotina."}, {"t": "Meningites", "q": "LCR: 250 células (linfomonocitário), proteína 280 mg/dL, glicose 20 mg/dL (glicemia 110), paralisia do VI par e hidrocefalia. Etiologia mais provável:", "o": ["Meningite viral", "Meningite tuberculosa", "Meningite pneumocócica", "Meningite asséptica por AINE"], "a": 1, "e": "Meningite basal: pares cranianos (VI), hidrocefalia, vasculite com infartos em núcleos da base."}, {"t": "Meningites", "q": "NÃO é fator de risco para meningite bacteriana:", "o": ["Diabetes", "Etilismo", "Deficiência de fatores de coagulação", "Anemia falciforme"], "a": 2, "e": "Anemia falciforme = asplenia funcional (germes encapsulados)."}, {"t": "Meningites", "q": "Encefalite herpética – assinale a incorreta:", "o": ["Acomete preferencialmente lobos temporais", "Aciclovir 10 mg/kg 8/8h por 14–21 dias", "PCR negativa nas primeiras 72 h exclui o diagnóstico", "Aciclovir deve ser iniciado empiricamente sem aguardar exames"], "a": 2, "e": "Se suspeita persistir, repetir PCR em 3–7 dias mantendo aciclovir."}, {"t": "Meningites", "q": "Meningite asséptica recorrente benigna (Mollaret) – agente mais associado:", "o": ["HSV-2", "Enterovírus", "CMV", "EBV"], "a": 0, "e": "Enterovírus é a causa mais comum de meningite viral em geral, mas a recorrente é HSV-2."}, {"t": "Meningites", "q": "Alternativa para meningite por Listeria em paciente comprovadamente alérgico a penicilina:", "o": ["Sulfametoxazol-trimetoprima", "Meropenem", "Ceftriaxona", "Amicacina"], "a": 0, "e": "Cefalosporinas não cobrem Listeria. Meropenem tem atividade, mas reação cruzada e menor evidência."}, {"t": "Doença meningocócica (artigo)", "q": "Quimioprofilaxia de contato íntimo de doença meningocócica em adulto:", "o": ["Rifampicina 600 mg 12/12h por 2 dias", "Amoxicilina por 7 dias", "Azitromicina por 5 dias", "Penicilina benzatina"], "a": 0, "e": "Alternativas: ceftriaxona 250 mg IM dose única (gestantes) ou ciprofloxacino 500 mg VO dose única. Idealmente em até 24 h (até 10 dias)."}, {"t": "Doença meningocócica (artigo)", "q": "Paciente com doença meningocócica tratado com penicilina cristalina. Assinale a correta:", "o": ["Não precisa de quimioprofilaxia, pois já foi tratado", "Deve receber quimioprofilaxia antes da alta, pois a penicilina não erradica o estado de portador", "Deve repetir o LCR antes da alta", "Os contatos dispensam profilaxia"], "a": 1, "e": "Ceftriaxona erradica a colonização de nasofaringe; penicilina/ampicilina não."}, {"t": "Doença meningocócica (artigo)", "q": "Deficiência imunológica que mais predispõe a infecção meningocócica recorrente:", "o": ["Deficiência de complemento terminal (C5–C9)", "Deficiência de IgA", "Neutropenia", "Deficiência de células T"], "a": 0, "e": "Também: uso de eculizumabe/ravulizumabe (inibidores de C5) e asplenia."}, {"t": "Doença meningocócica (artigo)", "q": "Profissional de saúde – indicação de quimioprofilaxia para doença meningocócica:", "o": ["Todos que atenderam o paciente", "Apenas exposição desprotegida a secreções respiratórias (ex.: IOT, aspiração sem máscara)", "Nunca", "Toda a equipe da enfermaria"], "a": 1, "e": "Contato rotineiro com o paciente não indica profilaxia."}, {"t": "Doença meningocócica (artigo)", "q": "Isolamento do paciente com doença meningocócica:", "o": ["Aerossóis por 7 dias", "Gotículas até 24 h após início de antibiótico eficaz", "Apenas contato", "Desnecessário"], "a": 1, "e": "Precaução para gotículas (máscara cirúrgica)."}, {"t": "Doença meningocócica (artigo)", "q": "Púrpura fulminans/síndrome de Waterhouse-Friderichsen – assinale a incorreta:", "o": ["Relaciona-se a CIVD e endotoxemia", "Cursa com hemorragia adrenal bilateral", "Pode ocorrer sem meningite (meningococcemia)", "A meningite associada indica pior prognóstico que a meningococcemia isolada"], "a": 3, "e": "Meningococcemia sem meningite tem PIOR prognóstico (choque fulminante)."}, {"t": "Doença meningocócica (artigo)", "q": "Duração habitual do tratamento da doença meningocócica com ceftriaxona:", "o": ["3 dias", "5 a 7 dias", "14 dias", "21 dias"], "a": 1, "e": "Pneumococo: 10–14 dias; Listeria: ≥21 dias; bacilos gram-negativos: 21 dias."}, {"t": "Tuberculose", "q": "Neurite óptica com discromatopsia verde-vermelho é efeito adverso de:", "o": ["Isoniazida", "Rifampicina", "Pirazinamida", "Etambutol"], "a": 3, "e": "Dose-dependente. Pirazinamida: hiperuricemia/artralgia. Isoniazida: neuropatia periférica (piridoxina)."}, {"t": "Tuberculose", "q": "Hepatotoxicidade durante RHZE – critério para suspensão do esquema:", "o": ["Transaminases > 2x LSN sem sintomas", "Transaminases > 3x com sintomas, > 5x sem sintomas, ou icterícia", "Qualquer elevação de transaminases", "Apenas icterícia"], "a": 1, "e": "Após normalização: reintrodução sequencial."}, {"t": "Tuberculose", "q": "Reintrodução após hepatotoxicidade (MS):", "o": ["RHZE juntos", "Rifampicina + etambutol, depois isoniazida, depois pirazinamida", "Pirazinamida primeiro", "Retirar a rifampicina definitivamente"], "a": 1, "e": "RE → H → Z, avaliando função hepática a cada etapa (3–7 dias)."}, {"t": "Tuberculose", "q": "Tuberculose pleural – assinale a incorreta:", "o": ["ADA > 40 U/L sugere o diagnóstico", "É exsudato linfocítico", "Células mesoteliais > 5% favorecem TB", "A baciloscopia do líquido tem baixa sensibilidade"], "a": 2, "e": "Células mesoteliais raras (<5%) são típicas de TB pleural. Biópsia pleural com granuloma: maior rendimento."}, {"t": "Tuberculose", "q": "PVHIV com TB em uso de inibidor de protease/ritonavir. Rifamicina recomendada:", "o": ["Rifampicina", "Rifabutina", "Rifapentina", "Nenhuma rifamicina"], "a": 1, "e": "Rifampicina reduz drasticamente os níveis dos IP; rifabutina é menor indutora."}, {"t": "Tuberculose", "q": "Infecção latente por TB – assinale a incorreta:", "o": ["Prova tuberculínica ≥ 5 mm indica tratamento em contatos", "3HP: rifapentina + isoniazida semanal, 12 doses", "4R: rifampicina por 4 meses", "PVHIV contato de TB pulmonar só trata se PT ≥ 10 mm"], "a": 3, "e": "PVHIV contato de TB pulmonar: tratar ILTB independentemente da PT (após excluir doença ativa)."}, {"t": "Tuberculose", "q": "Teste rápido molecular para TB (TRM-TB) – assinale a correta:", "o": ["Detecta resistência à isoniazida", "Detecta resistência à rifampicina", "Substitui a cultura em todos os casos", "É útil para controle de tratamento"], "a": 1, "e": "Não serve para controle: detecta DNA de bacilos mortos. Cultura segue necessária para teste de sensibilidade."}, {"t": "Sarampo", "q": "Sobre o sarampo, assinale a incorreta:", "o": ["Manchas de Koplik são patognomônicas, mas podem não aparecer", "Vitamina A previne a infecção pelo sarampo", "O exantema é maculopapular com progressão craniocaudal", "Conjuntivite é frequente"], "a": 1, "e": "Vitamina A é tratamento adjuvante (reduz complicações e mortalidade), não prevenção."}, {"t": "Sarampo", "q": "Complicação que mais leva ao óbito no sarampo:", "o": ["Encefalite aguda", "Pneumonia", "Panencefalite esclerosante subaguda", "Otite média"], "a": 1, "e": "Pneumonia (viral ou bacteriana secundária) é a principal causa de morte. Otite é a complicação mais comum em crianças."}, {"t": "Sarampo", "q": "Período de transmissibilidade do sarampo:", "o": ["Do início do exantema até 10 dias depois", "De 4–6 dias antes até 4 dias após o início do exantema", "Apenas durante a febre", "Até 2 semanas após o exantema"], "a": 1, "e": "Transmissão por aerossóis (e gotículas): precaução para aerossóis com N95."}, {"t": "Sarampo", "q": "Profilaxia pós-exposição ao sarampo:", "o": ["Vacin igo)", "q": "O que tem evidência de reduzir pneumonia aspirativa?", "o": ["Escopolamina para sialorreia", "Posição semissentada em paciente com rebaixamento neurológico", "Vitamina A após AVE", "IECA em hipertensos de rotina"], "a": 1, "e": "Gabarito da professora. Cabeceira 30–45°."}, {"t": "Pneumonia em UTI (artigo)", "q": "Pneumonia aspirativa sem abscesso ou empiema – cobertura de anaeróbios:", "o": ["Não é necessária de rotina", "Sempre metronidazol", "Sempre clindamicina", "Sempre carbapenêmico"], "a": 0, "e": "ATS/IDSA 2019: acrescentar anaeróbios só se abscesso pulmonar ou empiema."}, {"t": "Pneumonia em UTI (artigo)", "q": "Cobertura empírica de MRSA na PAV é indicada quando:", "o": ["Há fator de risco para MDR ou prevalência local de MRSA > 10–20%", "Sempre", "Nunca", "Apenas em queimados"], "a": 0, "e": "Opções: vancomicina ou linezolida."}, {"t": "Febre sem sinais localizatórios (artigo)", "q": "Infecção bacteriana grave mais comum em lactentes com febre sem sinais localizatórios:", "o": ["Infecção do trato urinário", "Bacteremia oculta pneumocócica", "Meningite", "Osteomielite"], "a": 0, "e": "Coletar urina adequada (sondagem/punção) em lactentes febris sem foco."}, {"t": "Febre sem sinais localizatórios (artigo)", "q": "Recém-nascido de 20 dias com febre sem foco e bom estado geral. Conduta:", "o": ["Observação domiciliar", "Internação, hemocultura, urocultura, LCR e antibiótico empírico", "Apenas exame de urina", "Amoxicilina VO"], "a": 1, "e": "Abaixo de 28–30 dias, mesmo com bom estado, é alto risco (Listeria, GBS, E. coli)."}, {"t": "Febre sem sinais localizatórios (artigo)", "q": "Fator que mais reduziu a bacteremia oculta em crianças com febre sem foco:", "o": ["Vacinas conjugadas contra pneumococo e Hib", "Uso de antitérmicos", "Aleitamento materno", "Suplementação de vitamina D"], "a": 0, "e": "Por isso a ITU passou a ser a principal infecção bacteriana oculta."}, {"t": "Febre sem sinais localizatórios (artigo)", "q": "Os critérios de Rochester identificam:", "o": ["Lactentes ≤ 60 dias de baixo risco para infecção bacteriana grave", "Risco de meningite tuberculosa", "Gravidade da dengue", "Risco de PAV"], "a": 0, "e": "Bom estado, previamente hígido, leucócitos 5.000–15.000, bastões < 1.500, urina normal."}, {"t": "IPPM no diabético (artigo)", "q": "Infecção leve de pé diabético, sem uso recente de antibiótico. Cobertura empírica:", "o": ["Gram-positivos aeróbios (S. aureus e estreptococos)", "Pseudomonas obrigatoriamente", "Anaeróbios + Pseudomonas", "Fungos"], "a": 0, "e": "Pseudomonas só se fator de risco (maceração, clima quente, isolamento prévio)."}, {"t": "IPPM no diabético (artigo)", "q": "Pé diabético – assinale a incorreta:", "o": ["Úlcera sem sinais clínicos de infecção não deve receber antibiótico", "Cultura de tecido profundo é preferível ao swab", "Probe-to-bone positivo aumenta a probabilidade de osteomielite", "Swab superficial é o método de escolha para guiar antibiótico"], "a": 3, "e": "Swab superficial cultiva colonizantes."}, {"t": "IPPM no diabético (artigo)", "q": "Padrão-ouro para o diagnóstico de osteomielite no pé diabético:", "o": ["Biópsia óssea com cultura e histopatologia", "Radiografia simples", "VHS", "Swab da úlcera"], "a": 0, "e": "RM é o melhor exame de imagem."}, {"t": "IPPM no diabético (artigo)", "q": "Classificação IDSA/IWGDF: infecção grave do pé diabético é aquela com:", "o": ["Sinais de resposta inflamatória sistêmica", "Eritema > 2 cm", "Abscesso profundo sem sinais sistêmicos", "Celulite < 2 cm"], "a": 0, "e": "Moderada: eritema > 2 cm ou estruturas profundas sem SIRS. Grave: SIRS."}, {"t": "IPPM no diabético (artigo)", "q": "Idoso diabético com otalgia intensa, otorreia e tecido de granulação no conduto auditivo. Agente:", "o": ["Pseudomonas aeruginosa", "Streptococcus pneumoniae", "Moraxella catarrhalis", "Staphylococcus epidermidis"], "a": 0, "e": "Otite externa maligna (necrotizante): pode evoluir com osteomielite da base do crânio e paralisia facial."}, {"t": "IPPM no diabético (artigo)", "q": "Fasciite necrosante tipo I – assinale a correta:", "o": ["É polimicrobiana e comum em diabéticos", "É monomicrobiana por S. pyogenes", "Não requer cirurgia", "É sempre causada por Clostridium"], "a": 0, "e": "Tipo II: S. pyogenes. Tratamento: desbridamento cirúrgico precoce + ATB amplo + clindamicina (antitoxina)."}, {"t": "Outros temas da prova", "q": "Tratamento da Covid-19 – assinale a incorreta:", "o": ["Dexametasona reduz mortalidade em pacientes com necessidade de O2", "Vitamina D tem benefício comprovado", "Dexametasona não beneficia quem não precisa de O2", "Tocilizumabe pode ser usado em hipoxêmicos com inflamação importante"], "a": 1, "e": "Sem benefício comprovado de vitamina D, ivermectina ou hidroxicloroquina."}, {"t": "Outros temas da prova", "q": "NÃO se correlaciona com estrongiloidíase:", "o": ["Larva currens", "Autoinfecção", "Infecção por HTLV-1", "Método de Kato-Katz"], "a": 3, "e": "Kato-Katz é para ovos (esquistossomose, geo-helmintos). Strongyloides: Baermann-Moraes, Rugai. Hiperinfecção com corticoide/HTLV-1: ivermectina."}, {"t": "Outros temas da prova", "q": "Neurocisticercose – assinale a incorreta:", "o": ["Eosinófilos no LCR são patognomônicos", "RM é o melhor exame para os cistos", "Corticoide é associado ao antiparasitário", "Calcificações na TC indicam lesões inativas"], "a": 0, "e": "Eosinofilorraquia sugere, mas não é patognomônica."}];
const L = "ABCDE";
const KEY = "infecto_mi_v1";
let store = {wrong:[], hist:[], sess:[], qs:{}};
try{ const s = localStorage.getItem(KEY); if(s) store = Object.assign(store, JSON.parse(s)); }catch(e){}
store.sess=store.sess||[]; store.qs=store.qs||{};
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(store)); }catch(e){} }

const temas = [...new Set(DATA.map(q=>q.t))];
let cfg = {temas:new Set(temas), modo:"treino", n:25};
let S = null;
const $ = (h)=>{ document.getElementById("app").innerHTML = h; window.scrollTo(0,0); };
const esc = s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function home(){
  const pool = DATA.filter(q=>cfg.temas.has(q.t)).length;
  const all = cfg.temas.size===temas.length;
  $(`<h1>Treino de Infectologia</h1>
  <p class="sub">${DATA.length} questões no estilo da prova de MI: diretas, específicas, 3 a 5 alternativas.</p>
  <div class="box"><p class="lbl">Modo</p><div class="seg">
    <button class="btn" aria-pressed="${cfg.modo==='treino'}" onclick="cfg.modo='treino';home()">Treino<br><small style="font-weight:400">correção a cada questão</small></button>
    <button class="btn" aria-pressed="${cfg.modo==='prova'}" onclick="cfg.modo='prova';home()">Simulado<br><small style="font-weight:400">correção no final</small></button>
  </div></div>
  <div class="box"><p class="lbl">Quantidade</p><div class="seg">
    ${[25,50,0].map(n=>`<button class="btn" aria-pressed="${cfg.n===n}" onclick="cfg.n=${n};home()">${n||'Todas'}</button>`).join("")}
  </div></div>
  <div class="box"><p class="lbl">Temas <button class="linky" style="float:right" onclick="toggleAll()">${all?'Limpar':'Marcar todos'}</button></p><div class="chips">
    ${temas.map((t,i)=>`<button class="chip" aria-pressed="${cfg.temas.has(t)}" onclick="tg(${i})">${esc(t)}<small>${DATA.filter(q=>q.t===t).length}</small></button>`).join("")}
  </div></div>
  <div class="row"><button class="btn primary" ${pool?'':'disabled'} onclick="start()">Começar (${cfg.n?Math.min(cfg.n,pool):pool})</button></div>
  ${store.wrong.length?`<div class="row"><button class="btn" onclick="startWrong()">Refazer as que errei (${store.wrong.length})</button></div>`:""}
  <div class="row"><button class="btn" onclick="painel()">Meu desempenho${tot()[0]?` (${pc(tot()[1],tot()[0])}% de acerto)`:''}</button></div>`);
}
function tg(i){ const t=temas[i]; cfg.temas.has(t)?cfg.temas.delete(t):cfg.temas.add(t); home(); }
function toggleAll(){ cfg.temas = cfg.temas.size===temas.length? new Set(): new Set(temas); home(); }

function build(ids){
  return ids.map(id=>{ const q=DATA[id]; const ord=shuffle(q.o.map((_,i)=>i)); return {id, ord, ans:ord.indexOf(q.a), pick:null}; });
}
function start(){
  let ids = DATA.map((q,i)=>i).filter(i=>cfg.temas.has(DATA[i].t));
  shuffle(ids); if(cfg.n) ids = ids.slice(0,cfg.n);
  S = {items:build(ids), i:0, modo:cfg.modo, t0:Date.now()}; show();
}
function startWrong(){ S = {items:build(shuffle([...store.wrong])), i:0, modo:"treino", t0:Date.now()}; show(); }

function show(){
  const it = S.items[S.i], q = DATA[it.id], n = S.items.length;
  const done = it.pick!==null, reveal = done && S.modo==="treino";
  const opts = it.ord.map((oi,k)=>{
    let c = "";
    if(reveal){ if(k===it.ans) c="ok"; else if(k===it.pick) c="bad"; }
    else if(k===it.pick) c="sel";
    return `<button class="opt ${c}" ${reveal?'disabled':''} onclick="pick(${k})"><b>${L[k]}</b><span>${esc(q.o[oi])}</span></button>`;
  }).join("");
  const right = it.pick===it.ans;
  $(`<div class="top"><button class="linky" onclick="quit()">Sair</button><span>${S.i+1} de ${n}</span></div>
  <div class="bar"><i style="width:${(S.i+(done?1:0))/n*100}%"></i></div>
  <span class="tema">${esc(q.t)}</span>
  <p class="qtext">${esc(q.q)}</p>${opts}
  ${reveal?`<div class="exp ${right?'okc':'badc'}"><strong>${right?'Certo':'Errado — resposta: '+L[it.ans]}</strong>${esc(q.e)}</div>`:""}
  <div class="row">
    ${S.i>0?`<button class="btn" onclick="S.i--;show()">Anterior</button>`:""}
    <button class="btn primary" ${done?'':'disabled'} onclick="next()">${S.i===n-1?'Ver resultado':'Próxima'}</button>
  </div>`);
}
function pick(k){ const it=S.items[S.i]; if(S.modo==="treino" && it.pick!==null) return; it.pick=k; if(S.modo==="treino") rec(it); show(); }
function next(){ if(S.i<S.items.length-1){S.i++;show();} else result(); }
function quit(){ const r=S.items.filter(x=>x.pick!==null); if(!r.length){ if(confirm("Encerrar e voltar ao início?")) home(); return; } if(confirm(`Encerrar e ver o resultado das ${r.length} respondidas?`)){ S.items=r; result(); } }

function rec(it){ const k=it.id, ok=it.pick===it.ans; const s=store.qs[k]||[0,0]; s[0]++; if(ok) s[1]++; store.qs[k]=s;
  const w=store.wrong.indexOf(k); if(ok){ if(w>-1) store.wrong.splice(w,1);} else if(w<0) store.wrong.push(k); save(); }
const pc=(a,b)=>b?Math.round(a/b*100):0;
function tot(){ let t=0,a=0; for(const k in store.qs){t+=store.qs[k][0];a+=store.qs[k][1];} return [t,a]; }
function cor(p){ return p>=80?'var(--ok)':p>=60?'var(--amber)':'var(--bad)'; }
function nivel(p){ return p>=80?'Pronto para a prova':p>=60?'Quase lá: revise os temas fracos':'Precisa revisar'; }
function barra(p){ return `<span class="mb"><i style="width:${p}%;background:${cor(p)}"></i></span>`; }
function tempo(s){ return s>=60?Math.floor(s/60)+' min '+(s%60)+' s':s+' s'; }
function startIds(ids){ S={items:build(shuffle(ids)), i:0, modo:'treino', t0:Date.now()}; show(); }

function painel(){
  const [t,a]=tot(), vistas=Object.keys(store.qs).length, p=pc(a,t);
  const by={}; temas.forEach(x=>by[x]=[0,0,0]);
  DATA.forEach((q,i)=>{ by[q.t][2]++; const s=store.qs[i]; if(s){by[q.t][0]+=s[0]; by[q.t][1]+=s[1];} });
  const feitos=temas.filter(x=>by[x][0]).sort((x,y)=>pc(by[x][1],by[x][0])-pc(by[y][1],by[y][0]));
  const nunca=temas.filter(x=>!by[x][0]);
  const fracos=feitos.filter(x=>pc(by[x][1],by[x][0])<70);
  window._fracos=fracos;
  const novas=DATA.map((q,i)=>i).filter(i=>!store.qs[i]); window._novas=novas;
  const ses=store.sess.slice(-12);
  const chart=ses.length?`<div class="box"><p class="lbl">Evolução (últimas ${ses.length} sessões)</p><div class="chart">${ses.map(s=>{const q=pc(s.ok,s.n);return `<div><span>${q}%</span><i style="height:${Math.max(q,2)}%;background:${cor(q)}"></i><span>${s.n}q</span></div>`;}).join('')}</div></div>`:'';
  const rows=feitos.map(x=>{const q=pc(by[x][1],by[x][0]);return `<tr><td>${esc(x)}</td><td>${barra(q)}${q}% <small>(${by[x][1]}/${by[x][0]})</small></td></tr>`;}).join('');
  $(`<div class="top"><button class="linky" onclick="home()">Voltar</button><span></span></div>
  <h1>Meu desempenho</h1>
  ${t?`<div class="box"><div class="score" style="color:${cor(p)}">${p}%</div><p style="margin:6px 0 12px;font-weight:600;color:${cor(p)}">${nivel(p)}</p>
  <div class="stats"><div class="stat"><b>${t}</b><span>respostas dadas</span></div><div class="stat"><b>${a}</b><span>acertos</span></div>
  <div class="stat"><b>${vistas}/${DATA.length}</b><span>questões já vistas</span></div><div class="stat"><b>${store.wrong.length}</b><span>erros pendentes</span></div></div></div>
  ${chart}
  <div class="box"><p class="lbl">Acerto por tema (piores primeiro)</p><table>${rows}</table>
  ${nunca.length?`<p class="lbl" style="margin-top:14px">Ainda não treinados</p>${nunca.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}`:''}</div>
  ${fracos.length?`<div class="box"><p class="lbl">Temas abaixo de 70%</p>${fracos.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<div class="row"><button class="btn primary" onclick="cfg.temas=new Set(_fracos);cfg.modo='treino';cfg.n=0;start()">Treinar temas fracos</button></div></div>`:''}
  <div class="row">${novas.length?`<button class="btn" onclick="startIds(_novas)">Questões nunca vistas (${novas.length})</button>`:''}${store.wrong.length?`<button class="btn" onclick="startWrong()">Refazer erradas (${store.wrong.length})</button>`:''}</div>
  <div class="row" style="margin-top:18px"><button class="linky" onclick="if(confirm('Apagar todo o histórico de desempenho?')){store={wrong:[],hist:[],sess:[],qs:{}};save();painel();}">Zerar histórico</button></div>`
  :`<div class="box"><p>Nenhuma questão respondida ainda. Faça um treino ou simulado e o desempenho aparece aqui.</p></div><div class="row"><button class="btn primary" onclick="home()">Começar</button></div>`}`);
}

function result(){
  const its=S.items, ok=its.filter(x=>x.pick===x.ans).length, pct=pc(ok,its.length), secs=Math.round((Date.now()-(S.t0||Date.now()))/1000);
  if(S.modo==="prova") its.forEach(rec);
  store.hist.push(pct); store.hist=store.hist.slice(-30);
  store.sess.push({d:Date.now(), n:its.length, ok, m:S.modo, s:secs}); store.sess=store.sess.slice(-50); save();
  const by={}; its.forEach(x=>{const t=DATA[x.id].t; by[t]=by[t]||[0,0]; by[t][1]++; if(x.pick===x.ans) by[t][0]++;});
  const rows=Object.entries(by).sort((a,b)=>a[1][0]/a[1][1]-b[1][0]/b[1][1]).map(([t,[a,b]])=>`<tr><td>${esc(t)}</td><td>${barra(pc(a,b))}${a}/${b}</td></tr>`).join("");
  const prev=store.sess.length>1?pc(store.sess[store.sess.length-2].ok,store.sess[store.sess.length-2].n):null;
  const errs=its.filter(x=>x.pick!==x.ans).map(x=>{const q=DATA[x.id];
    return `<div class="rev"><span class="tema">${esc(q.t)}</span><p class="q">${esc(q.q)}</p>
    <p class="y">Sua resposta: ${esc(q.o[x.ord[x.pick]])}</p><p class="c">Correta: ${esc(q.o[q.a])}</p><p>${esc(q.e)}</p></div>`;}).join("");
  $(`<h1>Resultado</h1>
  <div class="box"><div class="score" style="color:${cor(pct)}">${pct}%</div><p style="margin:6px 0 12px;font-weight:600;color:${cor(pct)}">${nivel(pct)}</p>
  <div class="stats"><div class="stat"><b>${ok}</b><span>acertos</span></div><div class="stat"><b>${its.length-ok}</b><span>erros</span></div>
  <div class="stat"><b>${tempo(secs)}</b><span>tempo total</span></div><div class="stat"><b>${tempo(Math.round(secs/its.length))}</b><span>por questão</span></div></div>
  ${prev!==null?`<p class="sub" style="margin:12px 0 0">Sessão anterior: ${prev}% (${pct-prev>=0?'+':''}${pct-prev} pontos)</p>`:''}</div>
  <div class="box"><p class="lbl">Por tema (piores primeiro)</p><table>${rows}</table></div>
  ${errs?`<div class="box"><p class="lbl">Revisão dos erros</p>${errs}</div>`:""}
  <div class="row"><button class="btn primary" onclick="home()">Novo treino</button><button class="btn" onclick="painel()">Desempenho geral</button>${store.wrong.length?`<button class="btn" onclick="startWrong()">Refazer erradas</button>`:""}</div>`);
}
home();
</script>
</body>
</html>
